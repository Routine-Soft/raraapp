# Gera o APK do Rara App numa máquina do GitHub (o notebook não aguenta o build).
# Roda a cada push na main ou manualmente em Actions → "Build APK" → "Run workflow".
# O APK fica para baixar no fim da execução, em "Artifacts".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      # O release é assinado com a chave de debug (android/app/build.gradle.kts).
      # Usa a MESMA chave do notebook, cujo SHA-1 está no Google Cloud —
      # sem ela o "Continuar com Google" não funciona no APK.
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::O segredo ANDROID_DEBUG_KEYSTORE_BASE64 não foi encontrado. Crie em Settings → Secrets and variables → Actions → aba 'Secrets' → 'New repository secret' (não em 'Variables' nem em 'Environments')."
            exit 1
          fi
          mkdir -p ~/.android
          # Tira espaços/quebras de linha que possam ter vindo ao colar
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > ~/.android/debug.keystore; then
            echo "::error::O texto do segredo não é um base64 válido. Copie de novo o conteúdo inteiro, sem cortar o começo nem o fim."
            exit 1
          fi
          echo "Chave com $(stat -c %s ~/.android/debug.keystore) bytes"
          if ! keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
               -storepass android -keypass android > keytool.txt 2>&1; then
            cat keytool.txt
            echo "::error::A chave decodificada não abriu. O texto colado provavelmente está incompleto."
            exit 1
          fi
          grep -E "SHA1:|SHA-1:" keytool.txt || cat keytool.txt
          rm keytool.txt

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build
        run: flutter build apk --release

      - name: Nome do arquivo
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          mv build/app/outputs/flutter-apk/app-release.apk "rara-app-$VERSION-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: rara-app-apk
          path: rara-app-*.apk
          retention-days: 30
