# Gera o APK do Rara App numa máquina do GitHub (o notebook não aguenta o build).
# Roda a cada push na main ou manualmente em Actions → "Build APK" → "Run workflow".
# O APK fica para baixar no fim da execução, em "Artifacts".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      # O release é assinado com a chave de debug (android/app/build.gradle.kts).
      # Usa a MESMA chave do notebook, cujo SHA-1 está no Google Cloud —
      # sem ela o "Continuar com Google" não funciona no APK.
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo ANDROID_DEBUG_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android | grep "SHA1:"

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Build
        run: flutter build apk --release

      - name: Nome do arquivo
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          mv build/app/outputs/flutter-apk/app-release.apk "rara-app-$VERSION-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rara-app-apk
          path: rara-app-*.apk
          retention-days: 30
